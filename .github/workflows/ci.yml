name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  quality:
    name: Dart quality and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify generated platform channels
        run: |
          dart run pigeon --input pigeons/native_auth_api.dart
          dart format lib/src/generated/native_auth_api.g.dart
          git diff --exit-code -- \
            lib/src/generated/native_auth_api.g.dart \
            android/src/main/kotlin/io/github/wreos/entra_external_id/NativeAuthApi.g.kt \
            ios/entra_external_id/Sources/entra_external_id/NativeAuthApi.g.swift

      - name: Verify formatting
        run: >-
          dart format
          --output=none
          --set-exit-if-changed
          lib test pigeons
          example/lib example/test example/integration_test

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Dart tests
        run: flutter test

      - name: Run example widget tests
        working-directory: example
        run: flutter test

      - name: Reject secrets and template placeholders
        run: |
          if git grep -n -E \
            'com\.example|getPlatformVersion|TODO|client[_-]?secret[[:space:]]*[:=]|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[0-9A-Za-z]{36,}|sk_live_[0-9A-Za-z]+' \
            -- ':!*.md' ':!*.lock' ':!.github/workflows/ci.yml'; then
            echo 'Sensitive or template content found in tracked source files.' >&2
            exit 1
          fi

      - name: Validate publishable package
        run: dart pub publish --dry-run

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  android:
    name: Android unit tests and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: 9.3.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        working-directory: example
        run: flutter pub get

      - name: Generate pinned Gradle wrapper
        working-directory: example/android
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type all

      - name: Run plugin Kotlin tests
        working-directory: example/android
        run: ./gradlew :entra_external_id:testDebugUnitTest --no-daemon --stacktrace

      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug

      - name: Upload example APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: entra-external-id-example-debug-apk
          path: example/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-integration:
    name: Android emulator integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: 9.3.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        working-directory: example
        run: flutter pub get

      - name: Generate pinned Gradle wrapper
        working-directory: example/android
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type all

      - name: Run Flutter integration test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: >-
            cd example &&
            flutter test integration_test/plugin_integration_test.dart
            -d emulator-5554

  ios:
    name: iOS XCTest and simulator integration
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        working-directory: example
        run: flutter pub get

      - name: Build iOS example with Swift Package Manager
        working-directory: example
        run: flutter build ios --simulator --debug --no-codesign

      - name: Boot an iOS simulator
        run: |
          simulator_id="$({ xcrun simctl list devices available --json; } | jq -r \
            '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          if [[ -z "$simulator_id" ]]; then
            echo 'No available iPhone simulator found.' >&2
            exit 1
          fi
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b

      - name: Run native XCTest suite
        working-directory: example/ios
        run: >-
          xcodebuild
          -project Runner.xcodeproj
          -scheme Runner
          -configuration Debug
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID"
          test
          CODE_SIGNING_ALLOWED=NO

      - name: Run Flutter integration test
        working-directory: example
        run: >-
          flutter test
          integration_test/plugin_integration_test.dart
          -d "$IOS_SIMULATOR_ID"
