name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  quality:
    name: Dart quality and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify generated platform channels
        run: |
          dart run pigeon --input pigeons/native_auth_api.dart
          dart format lib/src/generated/native_auth_api.g.dart
          git diff --exit-code -- \
            lib/src/generated/native_auth_api.g.dart \
            android/src/main/kotlin/io/github/wreos/microsoft_entra_external_id/NativeAuthApi.g.kt \
            ios/microsoft_entra_external_id/Sources/microsoft_entra_external_id/NativeAuthApi.g.swift

      - name: Verify formatting
        run: >-
          dart format
          --output=none
          --set-exit-if-changed
          lib test pigeons

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Dart tests
        run: flutter test

      - name: Reject secrets and template placeholders
        run: |
          if git grep -n -E \
            'com\.example|getPlatformVersion|TODO|client[_-]?secret[[:space:]]*[:=]|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[0-9A-Za-z]{36,}|sk_live_[0-9A-Za-z]+' \
            -- ':!*.md' ':!*.lock' ':!.github/workflows/ci.yml'; then
            echo 'Sensitive or template content found in tracked source files.' >&2
            exit 1
          fi

      - name: Validate publishable package
        run: dart pub publish --dry-run

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  android:
    name: Android unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Gradle version
        id: gradle-version
        run: |
          gradle_version="$(sed -nE \
            's#.*gradle-([0-9.]+)-all\.zip#\1#p' \
            example/android/gradle/wrapper/gradle-wrapper.properties)"
          if [[ -z "$gradle_version" ]]; then
            echo 'Unable to read the pinned Gradle version.' >&2
            exit 1
          fi
          echo "value=$gradle_version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ steps.gradle-version.outputs.value }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        working-directory: example
        run: flutter pub get

      - name: Generate pinned Gradle wrapper
        working-directory: example/android
        run: >-
          gradle wrapper
          --gradle-version "${{ steps.gradle-version.outputs.value }}"
          --distribution-type all

      - name: Run plugin Kotlin tests
        working-directory: example/android
        run: >-
          ./gradlew
          :microsoft_entra_external_id:testDebugUnitTest
          --no-daemon
          --stacktrace

  ios:
    name: iOS plugin compilation
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        working-directory: example
        run: flutter pub get

      - name: Generate iOS plugin host metadata
        working-directory: example
        run: flutter build ios --config-only --no-codesign --no-pub

      - name: Compile plugin target
        working-directory: example/ios
        run: >-
          xcodebuild
          -workspace Runner.xcworkspace
          -scheme microsoft-entra-external-id
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          build
          CODE_SIGNING_ALLOWED=NO
          IPHONEOS_DEPLOYMENT_TARGET=17.0
