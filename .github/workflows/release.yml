name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release candidate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  draft-release:
    name: Create draft GitHub release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify package version matches tag
        run: |
          package_version="$(awk '$1 == "version:" { print $2 }' pubspec.yaml)"
          expected_tag="v${package_version}"
          if [[ "$GITHUB_REF_TYPE" != 'tag' || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Expected tag $expected_tag, got $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
