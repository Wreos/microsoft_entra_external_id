org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.47 still casts AGP 9's extension to AbstractAppExtension.
android.newDsl=false
# Compile with AGP 9 built-in Kotlin. KGP 2.4 remains version-declared, but its
# deprecated kotlin-android plugin is not applied to either module.
android.builtInKotlin=true
