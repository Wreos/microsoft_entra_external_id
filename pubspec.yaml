name: microsoft_entra_external_id
description: "Flutter bridge for Microsoft Entra External ID Native Authentication using the official MSAL Android and iOS SDKs."
version: 0.1.0-dev.1
homepage: https://github.com/Wreos/microsoft_entra_external_id
repository: https://github.com/Wreos/microsoft_entra_external_id
issue_tracker: https://github.com/Wreos/microsoft_entra_external_id/issues
topics:
  - authentication
  - entra
  - external-id
  - msal

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.19.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Pinned because generated channel code must stay in sync across languages.
  pigeon: 28.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.wreos.microsoft_entra_external_id
        pluginClass: MicrosoftEntraExternalIdPlugin
      ios:
        pluginClass: MicrosoftEntraExternalIdPlugin
